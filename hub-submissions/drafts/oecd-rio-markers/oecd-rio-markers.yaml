cdh:
  domain: [socioeconomic, adaptation, mitigation]
  usage:
    intended_uses:
      - >
        Show how much climate-tagged aid a country already receives from bilateral providers, for the
        climate rationale or baseline of a funding proposal (e.g. a GCF concept note): adaptation and
        mitigation commitments per year over the last complete 5-10 years, principal and significant
        reported separately. The example script produces this table for Kenya.
      - >
        Identify which bilateral providers and sectors already fund adaptation in a country, to argue
        how a proposal complements them (e.g. which donors fund agriculture-related adaptation). The
        example script lists the top providers and sectors.
      - >
        Compare the weight given to adaptation versus mitigation in a country's bilateral aid over
        time, using constant prices (PRICE_BASE Q) and multi-year averages to smooth commitment spikes.
    not_recommended_for:
      - use: Adding adaptation and mitigation amounts together to get total climate finance.
        reason: One activity can carry both markers, so the same money is counted twice.
        use_instead: Report adaptation and mitigation separately, and say that they overlap.
      - use: Reading marked amounts as money spent on, or achieving, climate objectives.
        reason: Markers record the provider's declared objective when the money is committed, not disbursement or results.
        use_instead: Describe them as "ODA committed with a climate objective" and state the score used.
      - use: Treating the totals as all climate finance a country receives.
        reason: Multilateral organisations (World Bank, development banks, climate funds) and non-reporting providers are not in this dataset.
        use_instead: Add multilateral climate finance from the providers' own reports, and label this dataset as bilateral.
      - use: Adding principal and significant amounts without saying so.
        reason: Significant means climate is a secondary objective of the activity; how much of its value relates to climate is not stated here (_TBC_ against the Rio markers handbook).
        use_instead: Report principal and significant separately, or state clearly that both are included.
      - use: Reporting the latest year as a full year.
        reason: The latest year is published incomplete (2025 in October 2026) and filled in when detailed data appear in December.
        use_instead: Use the last complete year, and check for a later release.
      - use: Adding sector codes from different levels together (e.g. 310 and 311, or 100 and 140).
        reason: Higher-level sector codes already include the codes below them, so the sum counts the same money twice.
        use_instead: Use one sector level at a time.
      - use: Targeting or reporting climate aid at county or district level (e.g. Homa Bay County).
        reason: Country is the finest geography; there is no sub-national location.
        use_instead: The providers' own project records, or the OECD's bulk activity-level CRS files (project titles and descriptions), described in the oecd-dac-crs record.

processing:
  - id: source
    description: >
      Bilateral providers report every aid activity to the OECD's Creditor Reporting System and, for
      each one, score it against each Rio marker: 2 if the objective is principal, 1 if significant,
      0 if the activity was screened but does not target it. They apply the eligibility criteria and
      definitions in the DAC Rio markers handbook (https://one.oecd.org/document/DCD/DAC/STAT(2025)50/REV2/en/pdf), helped by the indicative tables of
      example activities (https://webfs.oecd.org/climate/Rio_markers_indicative_tables_approved.xlsx). The OECD Development Co-operation Directorate compiles the scored
      activities into the commitment totals served here, by provider, recipient, sector, marker and
      score. Assumptions users should know: the score is the provider's own judgement; values are
      commitments in US dollars at each year's exchange rate (current prices) or deflated with the DAC
      deflators (constant prices); and whether the full value of a "significant" activity is counted
      against the marker is not stated in the sources read for this record (_TBC_ against the
      handbook). Reporting rules and the other policy markers: https://www.oecd.org/content/oecd/en/data/insights/data-explainers/2024/10/resources-for-reporting-development-finance-statistics.html
    derived_from:
      - title: "CRS: Creditor Reporting System (flows)"
        url: "https://data-explorer.oecd.org/vis?lc=en&df%5Bds%5D=DcdDisseminateFinalDMZ&df%5Bid%5D=DSD_CRS@DF_CRS&df%5Bag%5D=OECD.DCD.FSD"
