spatial:
  bbox: [-180.0, -90.0, 180.0, 90.0]
  geography: [world]
  crs: EPSG:4326

temporal:
  start_date: "2002"
  end_date: null
  update_frequency: annual

structures:
  - name: rio-markers
    dimensions:
      - name: DONOR
        type: provider
        description: >
          Reporting provider. Single providers (country codes such as USA, DEU; 4EU001 EU Institutions)
          plus one total, DAC_EC. The API labels DAC_EC "DAC Members", but it is the sum of every single
          provider in this dataset, including EU Institutions and non-DAC reporting countries such as
          Romania where they report (checked: Kenya 2023, adaptation principal, 93.17 = 93.17). Do not
          add DAC_EC to the single providers.
        data_type: string
        reference_system: https://sdmx.oecd.org/dcd-public/rest/codelist/OECD.DCD.FSD/CL_AREA_ORG/1.6
      - name: RECIPIENT
        type: location
        description: Recipient country (ISO 3166-1 alpha-3) or a regional / unspecified entry.
        data_type: string
        reference_system: https://sdmx.oecd.org/dcd-public/rest/codelist/OECD.DCD.FSD/CL_AREA_ORG/1.6
      - name: SECTOR
        type: sector
        description: >
          Sector of the activity. Codes are nested several levels deep: 1000 all sectors > 450 sector
          allocable > 100 social infrastructure and services > 140 water supply & sanitation; or 300
          production sectors > 310 agriculture, forestry, fishing > 311 agriculture > 31120 agricultural
          development. Three-digit codes are not all at the same level. Pick codes from one level (the
          code list gives each code's parent; the example uses the sectors directly above the 5-digit
          purpose codes, which do not overlap). Leaving the position empty returns every level at
          once, which double-counts and can time out.
        data_type: string
        reference_system: https://sdmx.oecd.org/dcd-public/rest/codelist/OECD.DCD.FSD/CL_DAC_SECTOR/1.3
      - name: MEASURE
        type: measure
        description: Flow measure; always 100 (ODA) in this dataset.
        data_type: string
      - name: ALLOCABLE
        type: allocable
        description: Always 2 (bilateral aid allocable to a recipient) in this dataset.
        data_type: string
      - name: MARKER
        type: marker
        description: Rio marker. Codes from the shared CL_CRS_MARKER list; only these five occur in this dataset.
        data_type: string
        categories:
          - { value: "10", label: Biodiversity }
          - { value: "20", label: Climate change mitigation }
          - { value: "30", label: Climate change adaptation }
          - { value: "40", label: Desertification }
          - { value: "50", label: Environment }
      - name: SCORE
        type: score
        description: How central the objective is to the activity, as scored by the provider.
        data_type: string
        categories:
          - { value: "2", label: Principal (the main objective) }
          - { value: "1", label: Significant (a secondary objective) }
          - { value: "0", label: "Screened, not targeted" }
          - { value: "99", label: Not screened }
      - name: FLOW_TYPE
        type: flow
        description: Always C (commitments) in this dataset.
        data_type: string
      - name: PRICE_BASE
        type: price
        description: Price base.
        data_type: string
        categories:
          - { value: V, label: Current prices }
          - { value: Q, label: "Constant prices (DAC deflators, base year in the BASE_PER column; 2024 in October 2026)" }
      - name: MD_DIM
        type: level
        description: Aggregation level; use _T (aggregate).
        data_type: string
      - name: MD_ID
        type: identifier
        description: Activity identifier; 0 on aggregate rows.
        data_type: string
      - name: UNIT_MEASURE
        type: unit
        description: Currency unit; USD.
        data_type: string
      - name: TIME_PERIOD
        type: temporal
        description: Commitment year.
        data_type: string
        step: P1Y
    variables:
      - name: OBS_VALUE
        description: >
          ODA committed by the provider to the recipient in the sector and year, for activities given
          this score on this marker, in millions of US dollars at the stated price base.
        data_type: number
        unit: "1e6 USD"

data:
  - name: sdmx-csv
    structures: [rio-markers]
    description: >
      OECD SDMX REST data endpoint for the RioMarkers dataflow. Leave the version out of the URL to get
      the latest (1.7 in October 2026, which added 2025); a version can be pinned by appending ",1.7".
      Build the query as a positional key,
      DONOR.RECIPIENT.SECTOR.MEASURE.ALLOCABLE.MARKER.SCORE.FLOW_TYPE.PRICE_BASE.MD_DIM.MD_ID.UNIT_MEASURE,
      where an empty position means all values (e.g. DAC_EC.KEN.1000.100.2.30..C.V._T.0.USD = all DAC
      members and EU Institutions, Kenya, all sectors, adaptation, every score, commitments, current
      prices). Positions with one possible value in this dataset: MEASURE 100, ALLOCABLE 2, FLOW_TYPE C,
      MD_DIM _T, MD_ID 0, UNIT_MEASURE USD. Always fix SECTOR to one level (see the structure). Always fix the recipient: component filters (c[RECIPIENT]=...) are ignored and an
      unfiltered query returns the whole dataset. Add ?format=csvfilewithlabels for CSV with labels;
      without it the server returns SDMX-ML. Only aggregate rows (MD_DIM _T) are published: the CSV also
      carries project-level columns (PROJECT_TITLE, descriptions, donor agency and others) that are
      always empty here. See the example script.
    locations:
      - url: https://sdmx.oecd.org/dcd-public/rest/data/OECD.DCD.FSD,DSD_RIOMRKR@DF_RIOMARKERS/
        title: OECD SDMX REST (dcd-public), latest version
    media_type: application/vnd.sdmx.genericdata+xml

additional_assets:
  - name: example
    roles: [example]
    media_type: text/x-python
    description: >
      Adaptation and mitigation commitments to one recipient (Kenya by default), principal and
      significant shown separately, by year; the top providers and sectors for adaptation over the
      last complete years.
    locations:
      - url: ./example.py

