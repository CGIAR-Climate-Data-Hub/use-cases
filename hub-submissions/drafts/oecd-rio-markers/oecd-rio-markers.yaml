# FEDERATED record - the Hub points at the OECD API and does not host the data.
cdh_schema_version: v0.5.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json

id: oecd-rio-markers
title: OECD DAC Rio markers - ODA targeting climate adaptation, mitigation and the environment
version: "1.7"
description: >
  Development aid committed by bilateral providers (DAC members, EU Institutions and some other
  reporting countries) that they have tagged as targeting the Rio Conventions: climate change
  adaptation, climate change mitigation, biodiversity, desertification, and the environment in
  general. For each provider, recipient country, sector, marker and year it gives the amount of
  official development assistance (ODA) committed, split by how central the objective is to the
  activity: principal (the main objective), significant (a secondary objective), screened but not
  targeted, or not screened. Values are in millions of US dollars, at current or constant prices.
  It is the main source for climate-tagged aid by country. The Hub serves the OECD dataflow
  RioMarkers (DSD_RIOMRKR@DF_RIOMARKERS, version 1.7) through the OECD API.
resource_type: dataset
license: LicenseRef-OECD-Data-Terms
keywords:
  [Rio markers, climate finance, adaptation finance, mitigation finance, official development assistance, policy markers, SDMX]

note: >
  Limitations (assumptions are under processing; incorrect uses under cdh.usage).
  Which providers. Only bilateral providers that report Rio markers to the OECD: DAC members, EU
  Institutions and some other reporting countries. Multilateral organisations are not in this
  dataset, so climate finance from the World Bank, the regional development banks and the
  climate funds is missing; for many countries these are the largest climate funders. Providers
  that do not report to the OECD are absent too.
  Which recipients. Countries and territories on the DAC List of ODA Recipients (https://www.oecd.org/en/topics/oda-eligibility-and-conditions/dac-list-of-oda-recipients.html),
  plus regional and "unspecified" entries for aid not allocated to one country.
  What is counted. Commitments only (money promised in the year an agreement is signed), not
  disbursements, and only bilateral aid that can be allocated to a recipient (ALLOCABLE 2). A marker
  records the provider's declared objective when it commits the money, not what was spent or
  achieved. Each provider applies the marker definitions itself, so practice differs between
  providers. One activity can carry several markers (e.g. adaptation and mitigation).
  Time coverage. Mitigation and the environmental markers start in 2002 and adaptation in 2007
  (2010 for Kenya, for example). The latest year is incomplete: in October 2026 the 2025 values were
  a tiny fraction of 2024 (Kenya, adaptation principal: USD 0.1 million against 87.9 million),
  because detailed data are published in December for the previous year. Recent years are revised
  as providers resubmit.
  Location. The data are national: there is no sub-national location (county, district).
  Other policy markers, including disaster risk reduction (DRR), are in a separate OECD dataflow,
  OtherMarkers (DSD_OTHMRKR@DF_OTHERMARKERS), not here.

