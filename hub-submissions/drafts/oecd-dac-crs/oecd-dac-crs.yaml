cdh:
  domain: [socioeconomic, adaptation]
  usage:
    intended_uses:
      - >
        Describe the development finance a country already receives, for the context or baseline
        section of a funding proposal (e.g. a GCF concept note): total ODA disbursed per year over the
        last 5-10 years from all official providers (ALLD), the main single providers, and the amounts
        going to agriculture, water and environment. The example script produces these tables for
        Kenya (2024: USD 3,652 million from all official providers, of which USD 1,544 million from DAC
        member countries).
      - >
        Show where a proposed project fits among existing funders: list which providers already fund
        a sector in the country (e.g. agriculture, purpose codes 311xx) and how much, so the proposal
        can argue complementarity rather than duplication. Change the sector position of the key in
        the example script to the purpose code you need.
      - >
        Track trends in support to a sector over time, using disbursements at constant prices
        (PRICE_BASE Q) so that years are comparable after inflation and exchange-rate changes.
    not_recommended_for:
      - use: Treating the totals as all the external finance a country receives.
        reason: >
          Only providers that report to the OECD are included; private investment, remittances and
          non-reporting providers are missing.
        use_instead: >
          Say "development finance reported to the OECD", and add other sources (e.g. national aid
          records, remittance data) when a complete picture is needed.
      - use: Reading commitments as money spent, or comparing one year's commitments with the same year's disbursements.
        reason: >
          A multi-year commitment is recorded in full in the year it is signed, while disbursements in
          any year pay out commitments made in earlier years.
        use_instead: Use disbursements for money actually spent, and multi-year averages for commitments.
      - use: Targeting or reporting finance at county or district level (e.g. Homa Bay County).
        reason: Country is the finest geography; there is no sub-national location, and project text is not served by this API.
        use_instead: >
          The OECD's bulk activity-level CRS files (Data Explorer, Related files) include project titles
          and descriptions that can be screened for place names; the providers' own project records hold
          locations.
      - use: Adding up providers that include each other (e.g. DAC + United States, or World Bank Group + IDA).
        reason: Provider codes include groups that already contain their members, so sums count the same money twice.
        use_instead: Use ALLD for a recipient total, or single providers only (the example shows how to select them).
      - use: Using this dataflow to measure climate-related (adaptation or mitigation) finance.
        reason: The climate marker columns exist in its structure but are empty in this API dataflow.
        use_instead: Use the oecd-rio-markers record, which serves the Rio marker tables.
      - use: Adding sector totals (3- or 4-digit codes) and detailed purpose codes (5-digit) together.
        reason: Each sector total already includes its detailed purpose codes, so the sum counts the same money twice.
        use_instead: Use one sector level at a time (5-digit purpose codes, or the 1000 all-sector total).
      - use: Reporting the values as US dollars.
        reason: The values are in millions of US dollars.
        use_instead: Multiply by 1,000,000, or label the unit as "USD million".

processing:
  - id: source
    description: >
      Providers report every activity (project, programme or contribution) to the OECD in a single
      Creditor Reporting System format, following the DAC Converged Statistical Reporting Directives:
      what was funded, where, for what purpose (sector code), with which instrument, and any policy
      markers. Reporting happens once a year for the previous year; an earlier, aggregate-only
      questionnaire gives preliminary totals in April. The OECD Development Co-operation Directorate
      checks the activity-level reports against the aggregate totals providers also report, then
      compiles them into the aggregated tables served here. Assumptions users should know: the data
      record the provider's view (what it reports and how it classifies it), recipient totals are
      built from multilateral organisations' outflows rather than donors' core contributions, and
      values are converted to US dollars at each year's exchange rate (current prices) or with the
      DAC deflators (constant prices). Recipient totals count multilateral organisations' outflows to
      the country rather than donors' core contributions to them, so provider and recipient totals
      do not add up the same way. Read more: the reporting rules (Converged Statistical Reporting
      Directives, PDF) at https://one.oecd.org/document/DCD/DAC(2026)14/FINAL/en/pdf, and the OECD's methodology and resources page, with code lists,
      deflators and guidance on each field, at https://www.oecd.org/content/oecd/en/data/insights/data-explainers/2024/10/resources-for-reporting-development-finance-statistics.html
    derived_from:
      - title: Provider activity reports to the OECD (DAC Converged Statistical Reporting Directives)
        url: https://www.oecd.org/content/oecd/en/data/insights/data-explainers/2024/10/resources-for-reporting-development-finance-statistics.html
