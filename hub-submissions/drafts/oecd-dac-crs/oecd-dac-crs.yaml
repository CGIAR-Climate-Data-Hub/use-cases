cdh_schema_version: v0.5.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json

id: oecd-dac-crs
title: OECD DAC Creditor Reporting System (CRS) - development finance flows
version: "1.6"
description: >
  Official development assistance (ODA) and other development finance reported to the OECD by its
  Development Assistance Committee (DAC) members, other reporting countries, multilateral
  organisations and the largest private foundations, by provider, recipient country, sector, type
  of flow and year. It is the main international record of who funds what, where, in development
  co-operation. One value per combination of provider, recipient, sector, flow type and year, in
  millions of US dollars. It provides: official development assistance (ODA) in total and split
  into grants, loans and equity; other official flows (OOF, official finance on less concessional
  terms); private development finance from foundations; and private sector instruments. Each comes
  as commitments or disbursements, at current or constant prices, and can be broken down by
  channel (e.g. NGOs, multilateral organisations) and type of aid (e.g. budget support, projects).
  The codes for each are listed under structures below. The Hub serves the aggregated CRS dataflow
  (DSD_CRS@DF_CRS version 1.6) through the OECD API.
resource_type: dataset
license: LicenseRef-OECD-Data-Terms
keywords:
  [official development assistance, ODA, development finance, aid flows, climate finance, donors, SDMX]

note: >
  Limitations (assumptions are under processing; incorrect uses under cdh.usage).
  Which countries are included. Recipients: only countries and territories on the DAC List of ODA
  Recipients, which the DAC revises every three years; high-income countries are not on it and do
  not appear. The current list: https://www.oecd.org/en/topics/oda-eligibility-and-conditions/dac-list-of-oda-recipients.html (PDF for 2024 flows: https://webfs.oecd.org/oda/DAClists/DAC%20List%20of%20Aid%20Recipients%20-%202024%20flows.pdf). The
  RECIPIENT codes in this dataflow also include regional and "unspecified" entries for finance not
  allocated to one country. Providers: only those that report to the OECD, i.e. DAC members, other
  countries that choose to report, multilateral organisations and some large private foundations;
  the providers available are the DONOR codes (code list linked under structures). Finance from
  providers that do not report, private investment, remittances and domestic budgets is absent, so
  this is not the total external finance a country receives.
  Commitments and disbursements are different things. A commitment is recorded in full in the year
  it is signed, even when it is spent over several years; a disbursement is money actually paid in
  that year. Commitments jump from year to year; disbursements in a year do not match the same
  year's commitments because they pay out earlier ones.
  Sectors and purposes are assigned by each provider when it reports an activity, using the OECD
  code lists. Practice varies between providers, so sector totals reflect how providers label their
  work as well as what they fund.
  Coverage and timing. Detailed data appear once a year, in December, for the previous year; figures
  for recent years are revised as providers resubmit. Disbursements are available from 2002 and
  commitments from 1995; earlier years have gaps for some providers. Net flows can be negative where
  loan repayments exceed new lending. Since 2018 the headline ODA measure counts loans at their grant
  equivalent, while this dataflow reports cash flows, so totals differ from headline ODA figures.
  Location. The data are national: there is no sub-national location (county, district) in this
  dataflow.

