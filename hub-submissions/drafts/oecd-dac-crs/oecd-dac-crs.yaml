spatial:
  bbox: [-180.0, -90.0, 180.0, 90.0]
  geography: [world]
  crs: EPSG:4326

temporal:
  start_date: "2002"
  end_date: "2024"
  update_frequency: annual

structures:
  - name: crs
    dimensions:
      - name: DONOR
        type: provider
        description: >
          Reporting provider. Mixes single providers with groups that already contain them: ALLD (all
          official providers, countries and multilaterals: use this for "everything a country received"),
          DAC (DAC member countries only), DAC_EC (DAC countries plus EU Institutions), ALLM (all
          multilateral organisations), DACEU / DACEU_EC, G7, and nested multilateral groups such as
          5WBG0 World Bank Group > 5WB0 World Bank > 5WB002 IDA. Never add groups to their members. The
          example script shows how to keep single providers only.
        data_type: string
        reference_system: https://sdmx.oecd.org/dcd-public/rest/codelist/OECD.DCD.FSD/CL_AREA_ORG/1.6
      - name: RECIPIENT
        type: location
        description: Recipient country or region (ISO 3166-1 alpha-3 for countries, OECD codes for regions).
        data_type: string
        reference_system: https://sdmx.oecd.org/dcd-public/rest/codelist/OECD.DCD.FSD/CL_AREA_ORG/1.6
      - name: SECTOR
        type: sector
        description: CRS purpose code (5 digits) or sector aggregate (3-4 digits; 1000 = all sectors).
        data_type: string
        reference_system: https://sdmx.oecd.org/dcd-public/rest/codelist/OECD.DCD.FSD/CL_DAC_SECTOR/1.3
      - name: MEASURE
        type: measure
        description: Flow measure.
        data_type: string
        categories:
          - { value: "100", label: Official Development Assistance }
          - { value: "11", label: ODA grants }
          - { value: "13", label: ODA loans }
          - { value: "14", label: Other official flows (non export credit) }
          - { value: "19", label: Equity investment }
          - { value: "30", label: Private development finance }
          - { value: "60", label: Private sector instruments }
      - name: FLOW_TYPE
        type: flow
        description: >
          Commitments (C) or disbursements (D). The OECD code list does not say whether D is gross or net
          of loan repayments (separate codes 1120 gross and 1140 net exist) - _TBC_ with the OECD.
        data_type: string
        categories:
          - { value: C, label: Commitments }
          - { value: D, label: Disbursements }
      - name: PRICE_BASE
        type: price
        description: Price base of the values.
        data_type: string
        categories:
          - { value: V, label: Current prices }
          - { value: Q, label: Constant prices }
      - name: CHANNEL
        type: channel
        description: Channel of delivery (public sector, NGOs, multilateral organisations ...); _T = all channels.
        data_type: string
        reference_system: https://sdmx.oecd.org/dcd-public/rest/codelist/OECD.DCD.FSD/CL_CRS_CHANNEL
      - name: MODALITY
        type: modality
        description: Type of aid (budget support, projects, core contributions ...); _T = all modalities.
        data_type: string
        reference_system: https://sdmx.oecd.org/dcd-public/rest/codelist/OECD.DCD.FSD/CL_CRS_MODALITY
      - name: MD_DIM
        type: level
        description: Aggregation level. Use _T (aggregate); project/programme rows (DD) are not served by this API dataflow.
        data_type: string
        categories:
          - { value: _T, label: Aggregate }
          - { value: DD, label: Project/programme (not served here) }
      - name: MD_ID
        type: identifier
        description: Activity identifier; 0 on aggregate rows.
        data_type: string
      - name: UNIT_MEASURE
        type: unit
        description: Currency unit; USD.
        data_type: string
      - name: TIME_PERIOD
        type: temporal
        description: Reporting year.
        data_type: string
        step: P1Y
    variables:
      - name: OBS_VALUE
        description: >
          Flow amount for the provider, recipient, sector, measure, flow type and year, in millions
          of US dollars at the stated price base.
        data_type: number
        unit: "1e6 USD"

data:
  - name: sdmx-csv
    structures: [crs]
    description: >
      OECD SDMX REST data endpoint for dataflow DSD_CRS@DF_CRS 1.6. Build the query as a positional
      key, DONOR.RECIPIENT.SECTOR.MEASURE.CHANNEL.MODALITY.FLOW_TYPE.PRICE_BASE.MD_DIM.MD_ID.UNIT_MEASURE,
      where an empty position means all values (e.g. ALLD.KEN..100._T._T.D.V._T.0.USD = all official
      providers, Kenya, every sector, ODA, disbursements, current prices). The structure also lists
      project-level columns (PROJECT_TITLE, descriptions, CLIMATE_ADAPTATION and other markers); they
      are empty in this API dataflow. Always fix the recipient: the server
      ignores SDMX 3.0 component filters (c[RECIPIENT]=...) and an unfiltered query returns the whole
      cube (over 1 GB). Add ?format=csvfilewithlabels for CSV with labels; without it the server
      returns SDMX-ML. The all-DAC provider aggregate is DAC. Requests must go to sdmx.oecd.org/dcd-public
      (the dataflow is only referenced from sdmx.oecd.org/public). See the example script.
    locations:
      - url: https://sdmx.oecd.org/dcd-public/rest/data/OECD.DCD.FSD,DSD_CRS@DF_CRS,1.6/
        title: OECD SDMX REST (dcd-public)
    media_type: application/vnd.sdmx.genericdata+xml

additional_assets:
  - name: example
    roles: [example]
    media_type: text/x-python
    description: >
      ODA disbursements to one recipient (Kenya by default) from all DAC members, by year, with the
      agriculture, water and environment sectors split out, plus the top providers in the latest year.
    locations:
