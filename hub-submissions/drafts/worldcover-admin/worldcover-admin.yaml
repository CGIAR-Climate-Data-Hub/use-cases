cdh_schema_version: v0.5.0
extensions:
  - https://cgiar-climate-data-hub.github.io/cdh-metadata-standard/v0.5.0/extensions/cdh/schema.json

id: worldcover-admin
title: ESA WorldCover land-cover and cropland area by administrative unit (GAUL 2024, Africa)
version: "1"
description: >
  Area in hectares and share of each ESA WorldCover land-cover class, and of cropland, for every
  GAUL 2024 administrative unit at levels 0, 1 and 2, computed from the 10 m WorldCover maps for 2021
  (v200) and 2020 (v100). Pixels are assigned to the unit containing their centre and weighted by
  their true area on the sphere. One set of Parquet tables per country, for African countries.
resource_type: dataset
license: CC-BY-4.0
keywords:
  [land cover, cropland area, ESA WorldCover, administrative units, zonal statistics, GAUL]

note: >
  Areas sum to the rasterised unit (centre-pixel rule at 10 m), not to the vector polygon area;
  differences are small for large units and larger for small or narrow ones. The 2020 (v100) and
  2021 (v200) maps were made with different algorithms, so the two years are not a change series;
  the 2020 to 2021 transition table the script can also write is deliberately not published here.
  Class 40 (cropland) is annual herbaceous crops only: tree crops fall under tree cover and pasture
  under grassland, so cropland_ha undercounts agricultural land. Class 0 rows are no-data or outside
  the WorldCover footprint. Unit codes and names are GAUL 2024; disputed territories carry their own
  gaul0_code. Countries are produced on demand: the data folder lists which are available.

access: public

