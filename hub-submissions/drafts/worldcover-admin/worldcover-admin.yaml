citation:
  title: ESA WorldCover land-cover and cropland area by administrative unit (GAUL 2024, Africa)
  authors:
    - family: Steward
      given: Peter
  date: "2026"
  publisher: CGIAR Climate Data Hub

attribution: >
  Contains ESA WorldCover data: Zanaga, D. et al. (2022) ESA WorldCover 10 m 2021 v200,
  doi:10.5281/zenodo.7254221, and Zanaga, D. et al. (2021) ESA WorldCover 10 m 2020 v100,
  doi:10.5281/zenodo.5571936, CC BY 4.0. Boundaries: FAO GAUL 2024, CC BY 4.0.

created: "2026-10-20"
